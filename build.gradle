tasks.register('phase2DelayedRecoveryIntegrationTest', Test) {
    group = 'verification'
    description = 'Prove recovery completion after the actual 24-hour minimum delay on DevKit.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'phase2DelayedRecovery' }
    filter { includeTestsMatching 'com.bloxbean.cardano.kavach.contracts.AccountLifecycleDevkitTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

[transactionWitness: 1, cose: 2].each { label, mode ->
    tasks.register("${label}IntegrationTest", Test) {
        group = 'verification'
        description = "Qualify browser ${label} authentication and account lifecycle on DevKit."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        systemProperty 'kavach.browserMode', mode
        useJUnitPlatform { includeTags 'browserDevkit' }
        outputs.upToDateWhen { false }
        testLogging { showStandardStreams = true }
    }
}

// Frontend tools remain npm-native; Gradle exposes reproducible install/build entry points.
tasks.register('dashboardWebInstall', Exec) {
    group = 'build setup'
    description = 'Install the dashboard frontend from its pinned package-lock.json.'
    workingDir layout.projectDirectory.dir('dashboard-app/web')
    commandLine 'npm', 'ci'
}
tasks.register('dashboardWebBuild', Exec) {
    group = 'build'
    description = 'Type-check and bundle the dashboard frontend (run dashboardWebInstall first).'
    workingDir layout.projectDirectory.dir('dashboard-app/web')
    commandLine 'npm', 'run', 'build'
}
