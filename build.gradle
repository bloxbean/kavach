// Align CCL even on the annotation-processor classpath inherited from JuLC.
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'com.bloxbean.cardano' && requested.name.startsWith('cardano-client-')) {
            useVersion cclVersion
