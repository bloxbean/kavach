// Capture the compiler actually selected by Gradle, not merely the shell's Java.
tasks.register('phase0BuildManifest') {
    group = 'verification'
    dependsOn tasks.named('classes')
    doLast {
        def compiler = tasks.named('compileJava').get().javaCompiler.get().metadata
        def scripts = [:]
        fileTree('build/classes/java/main/META-INF/plutus').matching { include '*.plutus.json' }.files.sort().each { artifact ->
            if (!file('src/main/java/com/bloxbean/cardano/kavach/phase0/' + artifact.name.replace('.plutus.json', '.java')).exists()) return
            def parsed = new JsonSlurper().parse(artifact)
            scripts[artifact.name] = [sha256: MessageDigest.getInstance('SHA-256').digest(parsed.cborHex.decodeHex()).encodeHex().toString(),
                                     templateHash: parsed.hash, cborBytes: parsed.cborHex.length() / 2, params: parsed.params]
        }
        def manifest = [scope: 'Phase 0 unapplied probe templates; not production deployment hashes',
                        gradle: gradle.gradleVersion, javaRuntimeVersion: compiler.javaRuntimeVersion,
                        jvmVersion: compiler.jvmVersion, javaVendor: compiler.vendor,
                        compilerArgs: tasks.named('compileJava').get().options.compilerArgs,
                        julcVersion: julcVersion, cclVersion: cclVersion, scripts: scripts]
        def output = file('build/phase0/build-manifest.json'); output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
    }
}

// Aiken comparison only. Aiken is not a Kavach dependency and none of this is wired into `check`:
// it shells out to a tool whose binaries the repository does not pin, and a missing or drifted
// Aiken must fail loudly here rather than silently skew a comparison or break the build.
// Results and limitations: docs/fee-optimization/aiken-size-spike.md.
def aikenValidators = [AccountStateValidator: 'account_state', CoreCheckpoint: 'core_checkpoint',
                       AccountAssetValidator: 'account_asset', BudgetAccountAssetValidator: 'budget_account_asset',
                       StateNftPolicy: 'state_nft', PeriodicBudgetValidator: 'periodic_budget',
                       PeriodicBudgetNftPolicy: 'periodic_budget_nft', Ed25519Module: 'ed25519_module',
                       BrowserModule: 'browser_module', PolicyModule: 'policy_module',
                       BudgetPolicyModule: 'budget_policy_module', MixedSetupModule: 'mixed_setup_module']
// Strips CBOR byte-string wrappers until the flat program remains.
def flatBytes = { String hex ->
    byte[] bytes = hex.decodeHex()
    while (bytes.length > 0 && ((bytes[0] & 0xff) >> 5) == 2) {
        int info = bytes[0] & 31
        int offset = info < 24 ? 1 : info == 24 ? 2 : info == 25 ? 3 : 5
        bytes = Arrays.copyOfRange(bytes, offset, bytes.length)
    }
    bytes.length
}

tasks.register('aikenSizeSpike') {
    group = 'verification'
    description = 'Build the Aiken port and compare every validator\'s flat size with JuLC output.'
    dependsOn tasks.named('classes')
    doLast {
        def expected = 'v1.1.23'
        // Gradle's daemon does not inherit an interactive shell's PATH, so look where the
        // official installer puts it before giving up.
        def candidates = ['aiken', "${System.getProperty('user.home')}/.aiken/bin/aiken".toString()]
        def run = { List<String> command, File dir ->
            def process = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).start()
            def output = process.inputStream.text
            [status: process.waitFor(), output: output]
        }
        def binary = candidates.find { candidate ->
            try { run([candidate, '--version'], projectDir).status == 0 } catch (Exception ignored) { false }
        }
        if (binary == null)
            throw new GradleException('Aiken is not on PATH or in ~/.aiken/bin. Install ' + expected +
                    ' or read docs/fee-optimization/aiken-size-spike.md for the recorded result.')
        def actual = run([binary, '--version'], projectDir).output.trim()
        if (!actual.contains(expected))
            throw new GradleException("Aiken $expected is required for a comparable measurement; found: $actual")
        def port = file('contracts-aiken')
        ['check', 'build'].each { step ->
            def result = run([binary, step], port)
            if (result.status != 0) throw new GradleException("aiken $step failed:\n" + result.output)
        }
        def blueprint = new JsonSlurper().parse(file('contracts-aiken/plutus.json'))
        def sizes = [:]
        aikenValidators.each { julcName, aikenName ->
            def aiken = blueprint.validators.find { it.title.startsWith(aikenName + '.' + aikenName + '.') }
            if (aiken == null) throw new GradleException("Aiken blueprint has no validator $aikenName")
            def julc = new JsonSlurper().parse(file("build/classes/java/main/META-INF/plutus/${julcName}.plutus.json"))
            int julcFlat = flatBytes(julc.cborHex)
            int aikenFlat = flatBytes(aiken.compiledCode)
            sizes[julcName] = [julcFlatBytes: julcFlat, aikenFlatBytes: aikenFlat,
                               ratio: (julcFlat / (double) aikenFlat).round(3)]
            println String.format('%-28s JuLC %6d  Aiken %6d  %.3fx', julcName, julcFlat, aikenFlat, julcFlat / (double) aikenFlat)
        }
        def report = [scope: 'Unapplied templates, flat bytes; Aiken port for comparison only, not a second qualified implementation',
                      aikenVersion: actual, aikenStdlib: 'v2.2.0', julcVersion: julcVersion, validators: sizes]
        def out = file('build/fee-optimization/aiken-size-spike.json'); out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + '\n'
    }
}

