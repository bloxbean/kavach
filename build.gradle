// Record exactly the implementation artifacts qualified by Phase 1 evidence.
tasks.register('phase1BuildManifest') {
    group = 'verification'
    dependsOn tasks.named('classes')
    doLast {
        def names = ['AccountStateValidator', 'AccountAssetValidator', 'StateNftPolicy', 'CoreCheckpoint', 'Ed25519Module']
        def scripts = [:]
        names.each { name ->
            def artifact = file("build/classes/java/main/META-INF/plutus/${name}.plutus.json")
            def parsed = new JsonSlurper().parse(artifact)
            scripts[name] = [sha256: MessageDigest.getInstance('SHA-256').digest(parsed.cborHex.decodeHex()).encodeHex().toString(),
                             templateHash: parsed.hash, cborBytes: parsed.cborHex.length() / 2, params: parsed.params]
        }
        def sources = [:]
        fileTree('src/main/java/com/bloxbean/cardano/kavach').matching { include '**/*.java'; exclude 'phase0/**' }.files.sort().each { source ->
            sources[relativePath(source)] = MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        }
        def compiler = tasks.named('compileJava').get().javaCompiler.get().metadata
        def manifest = [scope: 'Phase 1 development templates; state is sealed; not production deployment hashes',
                        gradle: gradle.gradleVersion, javaRuntimeVersion: compiler.javaRuntimeVersion, javaVendor: compiler.vendor,
                        compilerArgs: tasks.named('compileJava').get().options.compilerArgs,
                        julcVersion: julcVersion, cclVersion: cclVersion, scripts: scripts, sources: sources]
        def output = file('build/phase1/build-manifest.json'); output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
    }
}

