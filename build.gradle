tasks.register('aikenPortComparison') {
    group = 'verification'
    description = 'Compare Aiken and JuLC outcomes, execution budgets, applied sizes and an estimated transfer fee.'
    dependsOn tasks.named('aikenParityJulc'), tasks.named('aikenParityAiken')
    doLast {
        def parse = { String name ->
            def budgets = [:].withDefault { [] }
            def sizes = [:]
            file("build/fee-optimization/aiken-port/${name}.tsv").eachLine { line ->
                def f = line.split('\t')
                if (f[0] == 'size') sizes[f[1]] = Math.max(sizes.getOrDefault(f[1], 0), f[2] as int)
                else budgets[[f[0], f[1]]] << [success: f[2] == 'success', cpu: f[3] as long, mem: f[4] as long]
            }
            [budgets: budgets, sizes: sizes]
        }
        def julc = parse('julc')
        def aiken = parse('aiken')
        int evaluations = julc.budgets.values().sum { it.size() }
        def divergences = []
        def ratios = [:].withDefault { [cpu: [], mem: []] }
        (julc.budgets.keySet() + aiken.budgets.keySet()).each { key ->
            def j = julc.budgets[key]; def a = aiken.budgets[key]
            if (j*.success.sort() != a*.success.sort()) divergences << key.join(' ')
            def js = j.findAll { it.success }; def as_ = a.findAll { it.success }
            if (js.size() == as_.size())
                [js, as_].transpose().each { pair -> ratios[key[1]].cpu << pair[1].cpu / (double) pair[0].cpu; ratios[key[1]].mem << pair[1].mem / (double) pair[0].mem }
        }
        def summary = { List<Double> values -> def s = values.sort(); [median: s[s.size().intdiv(2)].round(3), max: s[-1].round(3), min: s[0].round(3)] }
        def roleRatios = ratios.collectEntries { role, r -> [role, [acceptedEvaluations: r.cpu.size(), cpu: summary(r.cpu), memory: summary(r.mem)]] }
        def failures = []
        fileTree('build/test-results/aikenParityAiken').matching { include '*.xml' }.each { report ->
            def suite = new groovy.xml.XmlSlurper().parse(report)
            suite.testcase.findAll { !it.failure.isEmpty() || !it.error.isEmpty() }.each {
                failures << "${it.@classname.text().tokenize('.')[-1]}.${it.@name.text()}: ${(it.failure.@message.text() ?: it.error.@message.text()).take(120)}"
            }
        }
        // Conway reference-script fee: 15 lovelace/byte in 25,600-byte tiers, each 1.2x the last.
        def referenceFee = { int bytes ->
            double fee = 0, price = 15; int remaining = bytes
            while (remaining > 0) { int chunk = Math.min(remaining, 25600); fee += chunk * price; remaining -= chunk; price *= 1.2 }
            (long) Math.floor(fee)
        }
        def transfer = { Map run, String test ->
            def roles = ['asset', 'core', 'module'].collectEntries { role -> [role, run.budgets[[test, role]].find { it.success }] }
            double execution = roles.values().sum { it.mem * 0.0577d + it.cpu * 0.0000721d }
            [roles: roles, executionLovelace: (long) Math.ceil(execution)]
        }
        def estimate = { Map run, String module ->
            int bytes = ['AccountAssetValidator', 'CoreCheckpoint', module].sum { run.sizes[it] }
            def execution = transfer(run, 'AccountTransferTest.completeTransferExecutesEveryRequiredScript')
            // Base fee from the recorded Phase 2 transfer (1,617-byte transaction); identical for both.
            long base = 226529
            [referenceScriptBytes: bytes, referenceScriptLovelace: referenceFee(bytes), executionLovelace: execution.executionLovelace,
             baseLovelace: base, totalLovelace: base + referenceFee(bytes) + execution.executionLovelace, budgets: execution.roles]
        }
        // Whole-transaction totals for the maximum profiles, against max_tx_ex_mem 16,500,000 and
        // max_tx_ex_steps 10,000,000,000 including the SDK's 5% allowance.
        def combined = { String directory ->
            ['combined-budget.json', 'combined-positive-reward-budget.json', 'combined-eight-recipient-budget.json',
             'combined-positive-reward-eight-recipient-budget.json'].collectEntries { name ->
                def evidence = new JsonSlurper().parse(file("$directory/$name"))
                [name - '.json', [memoryWithFivePercentAllowance: evidence.memoryWithFivePercentAllowance,
                                  cpuWithFivePercentAllowance: evidence.cpuWithFivePercentAllowance]]
            }
        }
        def replacement = { Map run ->
            def key = 'AccountModuleReplacementTest.maximumOldApprovalAndCandidatePossessionFitTogether'
            def accepted = ['state', 'core', 'module', 'candidate'].collect { run.budgets[[key, it]].find { it.success } }.findAll { it != null }
            [memory: accepted.sum { it.mem }, cpu: accepted.sum { it.cpu },
             memoryWithFivePercentAllowance: accepted.sum { (it.mem * 105 + 99).intdiv(100) },
             cpuWithFivePercentAllowance: accepted.sum { (it.cpu * 105 + 99).intdiv(100) }]
        }
        def report = [scope: 'Fabricated script contexts in the JuLC VM at PV11; fee is an estimate from those budgets, not a ledger measurement',
                      julcVersion: julcVersion,
                      outcomeParity: [evaluations: evaluations, divergences: divergences],
                      aikenSuiteFailures: failures,
                      executionRatiosAikenOverJulc: roleRatios,
                      appliedSizes: [julc: julc.sizes.sort(), aiken: aiken.sizes.sort()],
                      maximumProfiles: [limits: [memory: 16500000, cpu: 10000000000L],
                                        transfer: [julc: combined('build/phase1'), aiken: combined('build/fee-optimization/aiken-port')],
                                        moduleReplacement: [julc: replacement(julc), aiken: replacement(aiken)]],
                      ed25519Transfer: [julc: estimate(julc, 'Ed25519Module'), aiken: estimate(aiken, 'Ed25519Module')]]
        def out = file('build/fee-optimization/aiken-port-comparison.json'); out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + '\n'
        println "Evaluations: $evaluations, outcome divergences: ${divergences.size()}, Aiken suite failures: ${failures.size()}"
        println "Ed25519 transfer estimate: JuLC ${report.ed25519Transfer.julc.totalLovelace}, Aiken ${report.ed25519Transfer.aiken.totalLovelace} lovelace"
    }
}

// Normative baseline changes must be reviewed together with their conformance fixtures.
tasks.register('verifyProtocolBaseline') {
    group = 'verification'
    doLast {
        def manifest = new JsonSlurper().parse(file('protocol/v1/manifest.json'))
        def paths = fileTree('protocol/v1').matching { include '*.md', '*.cddl' }.files.collect { relativePath(it) }.toSet()
        paths.addAll(fileTree('conformance/v1').files.collect { relativePath(it) })
        if (paths != manifest.sha256.keySet()) throw new GradleException('Protocol baseline file set changed; review the manifest')
        manifest.sha256.each { path, expected ->
            def actual = MessageDigest.getInstance('SHA-256').digest(file(path).bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Protocol baseline changed: ${path}; review schema and fixtures together")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyProtocolBaseline') }

