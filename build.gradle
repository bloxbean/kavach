// A SNAPSHOT coordinate alone does not pin bytes. Verify the locally built JuLC
// binaries before compiling against or executing them; never silently republish it.
def verifyJulcToolchain = tasks.register('verifyJulcToolchain') {
    group = 'verification'
    description = 'Verify the locally published JuLC snapshot against its reviewed artifact hashes.'
    inputs.file('toolchain/julc/manifest.json')
    doLast {
        def manifest = new JsonSlurper().parse(file('toolchain/julc/manifest.json'))
        if (manifest.version != julcVersion) {
            throw new GradleException('JuLC version and reviewed toolchain manifest differ')
        }
        def seen = new HashSet<String>()
        [configurations.compileClasspath, configurations.annotationProcessor,
         configurations.testCompileClasspath, configurations.testRuntimeClasspath].each { configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                if (id.group == 'com.bloxbean.cardano' && id.name.startsWith('julc-')) {
                    def actual = MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                    if (id.version != julcVersion || manifest.artifacts[id.name] != actual) {
                        throw new GradleException("Unreviewed JuLC artifact: ${id}; do not overwrite the pinned snapshot")
                    }
                    seen.add(id.name)
                }
            }
        }
        if (seen != manifest.artifacts.keySet()) {
            throw new GradleException('Resolved JuLC modules differ from the reviewed manifest')
        }
    }
}
tasks.withType(JavaCompile).configureEach { dependsOn verifyJulcToolchain }

