// Capture the compiler actually selected by Gradle, not merely the shell's Java.
tasks.register('phase0BuildManifest') {
    group = 'verification'
    dependsOn tasks.named('classes')
    doLast {
        def compiler = tasks.named('compileJava').get().javaCompiler.get().metadata
        def scripts = [:]
        fileTree('build/classes/java/main/META-INF/plutus').matching { include '*.plutus.json' }.files.sort().each { artifact ->
            if (!file('src/main/java/com/bloxbean/cardano/kavach/phase0/' + artifact.name.replace('.plutus.json', '.java')).exists()) return
            def parsed = new JsonSlurper().parse(artifact)
            scripts[artifact.name] = [sha256: MessageDigest.getInstance('SHA-256').digest(parsed.cborHex.decodeHex()).encodeHex().toString(),
                                     templateHash: parsed.hash, cborBytes: parsed.cborHex.length() / 2, params: parsed.params]
        }
        def manifest = [scope: 'Phase 0 unapplied probe templates; not production deployment hashes',
                        gradle: gradle.gradleVersion, javaRuntimeVersion: compiler.javaRuntimeVersion,
                        jvmVersion: compiler.jvmVersion, javaVendor: compiler.vendor,
                        compilerArgs: tasks.named('compileJava').get().options.compilerArgs,
                        julcVersion: julcVersion, cclVersion: cclVersion, scripts: scripts]
        def output = file('build/phase0/build-manifest.json'); output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
    }
}

// Normative baseline changes must be reviewed together with their conformance fixtures.
tasks.register('verifyProtocolBaseline') {
    group = 'verification'
    doLast {
        def manifest = new JsonSlurper().parse(file('protocol/v1/manifest.json'))
        def paths = fileTree('protocol/v1').matching { include '*.md', '*.cddl' }.files.collect { relativePath(it) }.toSet()
        paths.addAll(fileTree('conformance/v1').files.collect { relativePath(it) })
        if (paths != manifest.sha256.keySet()) throw new GradleException('Protocol baseline file set changed; review the manifest')
        manifest.sha256.each { path, expected ->
            def actual = MessageDigest.getInstance('SHA-256').digest(file(path).bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Protocol baseline changed: ${path}; review schema and fixtures together")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyProtocolBaseline') }

// Validate documentation syntax and links. Missing-comment lint includes synthetic record
