<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Proposed network execution with user-controlled account authority"><title>Proposed network execution with user-controlled account authority</title><text x="380" y="23" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#B79853" text-anchor="middle">PROPOSED  /  NOT A DEPLOYED NETWORK</text><rect x="20" y="60" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="125.0" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">User approval</text><text x="125.0" y="108" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Phone or supported wallet</text><rect x="280" y="60" width="220" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="390.0" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Exact Kavach intent</text><text x="390.0" y="108" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Account policy satisfied</text><path d="M230,93 L280,93" stroke="#317C69" stroke-width="1.7"/><polygon points="280,93 272.79642318117857,96.47972427288984 272.79642318117857,89.52027572711016" fill="#317C69"/><rect x="265" y="175" width="250" height="66" rx="14" fill="#173E3A" stroke="#173E3A"/><text x="390.0" y="202" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Execution providers</text><text x="390.0" y="223" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#DAE8DE" text-anchor="middle">Discover, quote, build and fund</text><path d="M390,126 L390,175" stroke="#317C69" stroke-width="1.7"/><polygon points="390,175 386.5202757271102,167.7964231811786 393.4797242728898,167.7964231811786" fill="#317C69"/><rect x="535" y="175" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="640.0" y="202" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Cardano ledger</text><text x="640.0" y="223" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Validate and confirm</text><path d="M515,208 L535,208" stroke="#317C69" stroke-width="1.7"/><polygon points="535,208 527.7964231811786,211.47972427288985 527.7964231811786,204.52027572711015" fill="#317C69"/><text x="130" y="198" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#173E3A" text-anchor="middle">Account authority stays</text><text x="130" y="220" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#173E3A" text-anchor="middle">with the user.</text><rect x="20" y="292" width="720" height="77" rx="14" fill="#EEF3E9" stroke="#D8E1D9"/><text x="380" y="323" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#173E3A" text-anchor="middle">A simpler experience: review the action, approve, receive confirmation.</text><text x="380" y="347" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">Funding and execution are replaceable. Signed instructions are not.</text></svg>