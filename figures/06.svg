<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" role="img" aria-label="Optional budgets enforce one account-wide ADA cap"><title>Optional budgets enforce one account-wide ADA cap</title><rect x="260" y="10" width="240" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="380.0" y="37" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Approved payment</text><text x="380.0" y="58" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Check budget configuration</text><rect x="20" y="135" width="290" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="165.0" y="162" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Budget disabled</text><text x="165.0" y="183" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Independent inputs can be concurrent</text><rect x="450" y="135" width="290" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="595.0" y="162" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Budget enabled</text><text x="595.0" y="183" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Check period and remaining capacity</text><path d="M300,76 L165,135" stroke="#317C69" stroke-width="1.7"/><polygon points="165,135 170.20723149639966,128.92671916153193 172.994231315752,135.30375264649066" fill="#317C69"/><path d="M460,76 L595,135" stroke="#317C69" stroke-width="1.7"/><polygon points="595,135 587.005768684248,135.30375264649066 589.7927685036003,128.92671916153193" fill="#317C69"/><rect x="450" y="272" width="290" height="66" rx="14" fill="#173E3A" stroke="#173E3A"/><text x="595.0" y="299" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Spend + update counter</text><text x="595.0" y="320" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#DAE8DE" text-anchor="middle">One atomic ledger transaction</text><path d="M595,201 L595,272" stroke="#317C69" stroke-width="1.7"/><polygon points="595,272 591.5202757271102,264.79642318117857 598.4797242728898,264.79642318117857" fill="#317C69"/><text x="603.0" y="228.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">within cap</text><text x="165" y="272" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">No shared counter to consume.</text><text x="595" y="381" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Over the cap? Reject.</text><text x="380" y="421" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">Competing enabled spends share one counter; a stale request must be rebuilt.</text></svg>