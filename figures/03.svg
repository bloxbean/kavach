<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315" role="img" aria-label="Three distinct stages: approve, fund, confirm"><title>Three distinct stages: approve, fund, confirm</title><text x="120" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#B79853" text-anchor="middle">01</text><rect x="15" y="66" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="120.0" y="93" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Approve intent</text><text x="120.0" y="114" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Wallet or iPhone keys</text><text x="380" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#B79853" text-anchor="middle">02</text><rect x="275" y="66" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="380.0" y="93" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Fund transaction</text><text x="380.0" y="114" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Fee wallet signs</text><text x="640" y="40" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#B79853" text-anchor="middle">03</text><rect x="535" y="66" width="210" height="66" rx="14" fill="#173E3A" stroke="#173E3A"/><text x="640.0" y="93" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm on-chain</text><text x="640.0" y="114" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#DAE8DE" text-anchor="middle">Ledger accepts the result</text><path d="M225,99 L275,99" stroke="#317C69" stroke-width="1.7"/><polygon points="275,99 267.79642318117857,102.47972427288984 267.79642318117857,95.52027572711016" fill="#317C69"/><path d="M485,99 L535,99" stroke="#317C69" stroke-width="1.7"/><polygon points="535,99 527.7964231811786,102.47972427288984 527.7964231811786,95.52027572711016" fill="#317C69"/><text x="120" y="176" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">One proof per required</text><text x="120" y="196" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">key and purpose.</text><text x="380" y="176" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">Funding cannot replace</text><text x="380" y="196" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">a COSE approval.</text><text x="640" y="176" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">A signature alone does</text><text x="640" y="196" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">not move funds.</text><rect x="15" y="235" width="730" height="58" rx="14" fill="#EEF3E9" stroke="#D8E1D9"/><text x="380" y="270" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#173E3A" text-anchor="middle">Mixed transaction-witness profiles also need their authority witnesses.</text></svg>