<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Three setup phases, ten current ledger transactions"><title>Three setup phases, ten current ledger transactions</title><text x="120" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#B79853" text-anchor="middle">01–06</text><rect x="15" y="67" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="120.0" y="94" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Prepare</text><text x="120.0" y="115" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">5 publications + registration</text><text x="380" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#B79853" text-anchor="middle">07</text><rect x="275" y="67" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="380.0" y="94" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Enroll</text><text x="380.0" y="115" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Genesis and key possession</text><text x="640" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#B79853" text-anchor="middle">08–10</text><rect x="535" y="67" width="210" height="66" rx="14" fill="#173E3A" stroke="#173E3A"/><text x="640.0" y="94" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Activate</text><text x="640.0" y="115" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#DAE8DE" text-anchor="middle">Final module and approvals</text><path d="M225,100 L275,100" stroke="#317C69" stroke-width="1.7"/><polygon points="275,100 267.79642318117857,103.47972427288984 267.79642318117857,96.52027572711016" fill="#317C69"/><path d="M485,100 L535,100" stroke="#317C69" stroke-width="1.7"/><polygon points="535,100 527.7964231811786,103.47972427288984 527.7964231811786,96.52027572711016" fill="#317C69"/><rect x="15" y="180" width="730" height="75" rx="14" fill="#EEF3E9" stroke="#D8E1D9"/><text x="380" y="212" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#173E3A" text-anchor="middle">Spending stays blocked until final activation.</text><text x="380" y="237" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">The setup module can activate only its precommitted final policy.</text></svg>