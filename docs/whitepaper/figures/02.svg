<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="An account persists while its credentials can change"><title>An account persists while its credentials can change</title><rect x="15" y="30" width="225" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="127.5" y="57" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Account identity</text><text x="127.5" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Unique state NFT</text><rect x="280" y="30" width="220" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="390.0" y="57" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Canonical state</text><text x="390.0" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Version, mode and policy</text><path d="M240,63 L280,63" stroke="#317C69" stroke-width="1.7"/><polygon points="280,63 272.79642318117857,66.47972427288984 272.79642318117857,59.52027572711016" fill="#317C69"/><rect x="535" y="30" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="640.0" y="57" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Authorization module</text><text x="640.0" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Configured keys and roles</text><path d="M500,63 L535,63" stroke="#317C69" stroke-width="1.7"/><polygon points="535,63 527.7964231811786,66.47972427288984 527.7964231811786,59.52027572711016" fill="#317C69"/><rect x="15" y="185" width="225" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="127.5" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Asset UTxOs</text><text x="127.5" y="233" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Account-controlled value</text><rect x="280" y="185" width="220" height="66" rx="14" fill="#173E3A" stroke="#173E3A"/><text x="390.0" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Immutable core</text><text x="390.0" y="233" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#DAE8DE" text-anchor="middle">Identity and value checks</text><path d="M240,218 L280,218" stroke="#317C69" stroke-width="1.7"/><polygon points="280,218 272.79642318117857,221.47972427288985 272.79642318117857,214.52027572711015" fill="#317C69"/><path d="M390,96 L390,185" stroke="#317C69" stroke-width="1.7"/><polygon points="390,185 386.5202757271102,177.7964231811786 393.4797242728898,177.7964231811786" fill="#317C69"/><text x="398.0" y="132.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">read state</text><rect x="535" y="185" width="210" height="66" rx="14" fill="#FFFFFF" stroke="#D8E1D9"/><text x="640.0" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#173E3A" text-anchor="middle">Valid outputs</text><text x="640.0" y="233" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#687871" text-anchor="middle">Recipients and change</text><path d="M500,218 L535,218" stroke="#317C69" stroke-width="1.7"/><polygon points="535,218 527.7964231811786,221.47972427288985 527.7964231811786,214.52027572711015" fill="#317C69"/><text x="380" y="307" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#173E3A" text-anchor="middle">Change a supported key or module. Keep the account address.</text><text x="380" y="337" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#687871" text-anchor="middle">Changing the immutable core is a separate migration question.</text></svg>